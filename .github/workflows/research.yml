# Investigación nocturna con replay histórico (en paralelo al trading).
# 03:23 hora de España (02:23 UTC), de martes a sábado: solo tras días con datos nuevos.
name: research

on:
  schedule:
    - cron: "23 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trader            # comparte cola con el trading para no pisarse al guardar
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Investigar
        run: python -m trader --phase research
      - name: Guardar resultados
        run: |
          git config user.name "claude-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state docs
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "research: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
