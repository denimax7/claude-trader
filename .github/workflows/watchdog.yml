# Comprueba cada hora que el vigilante está vivo; si no, lo arranca.
# (Aunque GitHub retrase esta comprobación, el vigilante se relanza solo.)
name: watchdog

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Arrancar el vigilante si no está en marcha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh run list -R "$REPO" --workflow heartbeat.yml --json status \
                --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending")] | length')
          echo "vigilantes activos: $n"
          if [ "$n" = "0" ]; then gh workflow run heartbeat.yml -R "$REPO" --ref main; echo "arrancado"; fi
