# Ejecución MANUAL de una fase (el trabajo diario lo hace heartbeat.yml).
# Ejecuta el agente 3 veces por sesión de la Bolsa de Nueva York.
# GitHub usa UTC y no sabe de horario de verano: cada fase se programa a las dos
# horas UTC posibles y el programa decide (por hora de Nueva York) si toca o no.
# Hora de España: apertura ~15:35, media sesión ~18:45, antes del cierre ~21:45.
# La nota diaria y la revisión semanal las escriben tareas programadas de Claude
# (incluidas en el plan, sin API): ver CLAUDE.md.
name: trader

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Fase a ejecutar"
        type: choice
        options: [auto, open, mid, close, signal, explore, review, research]
        default: auto
      force:
        description: "Forzar aunque ya se haya ejecutado hoy o el mercado esté cerrado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # último estado real (no el del momento del disparo)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PHASE="${{ inputs.phase || 'auto' }}"
          if [ "${{ github.event.schedule }}" = "17 7 * * 6" ]; then PHASE=explore; fi
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python -m trader --phase "$PHASE" $FORCE

      - name: Guardar estado y panel
        run: |
          git config user.name "claude-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state docs
          if [ -d reviews ]; then git add -A reviews; fi
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "trader: ${{ inputs.phase || 'auto' }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
