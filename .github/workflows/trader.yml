# Ejecuta el agente 3 veces por sesión de la Bolsa de Nueva York.
# GitHub usa UTC y no sabe de horario de verano: cada fase se programa a las dos
# horas UTC posibles y el programa decide (por hora de Nueva York) si toca o no.
# Hora de España: apertura ~15:35, media sesión ~18:45, antes del cierre ~21:45.
name: trader

on:
  schedule:
    - cron: "35 13,14 * * 1-5"   # apertura  (9:35 NY)
    - cron: "45 16,17 * * 1-5"   # media     (12:45 NY)
    - cron: "45 19,20 * * 1-5"   # pre-cierre (15:45 NY)
    - cron: "17 9 * * 6"         # sábado: revisión semanal con Claude
  workflow_dispatch:
    inputs:
      phase:
        description: "Fase a ejecutar"
        type: choice
        options: [auto, open, mid, close, review]
        default: auto
      force:
        description: "Forzar aunque ya se haya ejecutado hoy o el mercado esté cerrado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PHASE="${{ inputs.phase || 'auto' }}"
          if [ "${{ github.event.schedule }}" = "17 9 * * 6" ]; then PHASE=review; fi
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python -m trader --phase "$PHASE" $FORCE

      - name: Guardar estado y panel
        run: |
          git config user.name "claude-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs reviews 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "trader: ${{ inputs.phase || 'auto' }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
